; PlatformIO Project Configuration File
; Target board: Waveshare ESP32-S3-Touch-ePaper-1.54 (V2)
; MCU: ESP32-S3-PICO-1-N8R8 (8 MB Quad Flash + 8 MB Octal PSRAM)

[env:waveshare-esp32s3-epaper-154-v2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Memory layout for ESP32-S3-PICO-1-N8R8
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  -DCORE_DEBUG_LEVEL=3
  -DFOXIE_DEVICE_SOURCE=\"waveshare-154\"

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  zinggjm/GxEPD2@^1.5.8
  ricmoo/QRCode@^0.0.1
